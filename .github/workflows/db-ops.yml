name: Database operations (read-only)

# Manual, read-only access to the production database: a schema dump plus the
# migration history, or a catalog fingerprint. Nothing here changes production.
# The one credential is the SUPABASE_DB_URL secret on the production-db
# environment (the Session pooler string); tools.migrations.prod_dsn checks and
# masks it and hands it to the CLI's --db-url as $PROD_DSN.

on:
  workflow_dispatch:
    inputs:
      op:
        description: What to read from production
        type: choice
        options: [dump, fingerprint]
        required: true

permissions:
  contents: read

concurrency:
  group: db-ops
  cancel-in-progress: false

jobs:
  read:
    name: Read production (${{ inputs.op }})
    runs-on: ubuntu-24.04
    environment: production-db
    env:
      PROJECT_REF: fdhspmavadgucktetzoi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Install migration tools
        run: python -m pip install -r requirements-ci.txt
      - name: Dump schema and history
        if: inputs.op == 'dump'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -m tools.migrations.prod_dsn -- bash -euo pipefail -c '
            supabase db dump --db-url "$PROD_DSN" -f baseline.sql
            supabase migration list --db-url "$PROD_DSN" > history.txt
          '
          wc -l baseline.sql history.txt
      - name: Upload dump
        if: inputs.op == 'dump'
        uses: actions/upload-artifact@v4
        with:
          name: prod-dump
          path: |
            baseline.sql
            history.txt
          if-no-files-found: error
          retention-days: 30
      - name: Capture fingerprint
        if: inputs.op == 'fingerprint'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: >-
          python -m tools.migrations.prod_dsn --
          python -m tools.migrations.fingerprint capture --dsn-env PROD_DSN --out prod-fingerprint.json
      - name: Upload fingerprint
        if: inputs.op == 'fingerprint'
        uses: actions/upload-artifact@v4
        with:
          name: prod-fingerprint
          path: prod-fingerprint.json
          if-no-files-found: error
          retention-days: 30
