name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  metrics-reader:
    name: Offline metrics reader and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install reader and optional MCP adapter
        run: python -m pip install -e '.[metrics-mcp,dev]'
      - name: Run fixture-only core and adapter tests
        run: python -m pytest tests/test_supabase_metrics*.py -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      # The repository is public: scan every commit on every run, and print
      # each finding (file, line, commit, rule) with its value redacted, so the log
      # never repeats a leaked value.
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .

  python:
    name: Permitted acceptance PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8.0" "ruff==0.15.20"
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard
      - name: Ruff lint
        run: ruff check .
      - name: Run permitted tests in an owned database
        run: >-
          python tools/lifecycle_test_db.py --postgres-major ${{ matrix.postgres }} --
          python tools/run_lifecycle_acceptance.py
      - name: Run permitted owned dashboard flows
        run: >-
          python tools/lifecycle_test_db.py --postgres-major ${{ matrix.postgres }} --
          python tools/run_lifecycle_acceptance.py dashboard
      - name: Run the dashboard database test lane
        run: >-
          python tools/lifecycle_test_db.py --postgres-major ${{ matrix.postgres }} --
          npm --prefix dashboard run test:db

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  public-visual:
    name: Public visual
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run public visual regression gate
        run: npm run test:visual:public
      - name: Upload public visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-visual-results
          path: |
            dashboard/test-results/visual/**
            !dashboard/test-results/visual/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  # Real-browser enforcement tests for the variant 3 sandbox (plan Task 2.7): every case in
  # Chromium, Firefox and WebKit against `next build` + `next start`, with a local canary
  # server. The per-case JSON results are uploaded on success too, because gate A18 is
  # decided from them.
  sandbox-enforcement:
    name: Sandbox enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test
      # The harness renders its hostile cases only on this explicit opt-in (fails closed).
      SANDBOX_HARNESS: "1"
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run sandbox enforcement tests
        run: npm run test:sandbox
      - name: Upload sandbox per-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-enforcement-cases
          path: dashboard/test-results/sandbox/results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sandbox failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-enforcement-results
          path: |
            dashboard/test-results/sandbox/**
            !dashboard/test-results/sandbox/results/**
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04
    env:
      # Local throwaway Supabase database started by this job; not a secret.
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Unit-test migration tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pytest tests/migration_tooling -q
      - name: Check PR scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.migrations.pr_scope --base "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Check migration file rules
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No pipeline migrations yet."
            exit 0
          fi
          python -m tools.migrations.check_rules "${files[@]}"
      - name: Lint changed migrations
        if: steps.scope.outputs.added != '' && steps.scope.outputs.added != '[]'
        env:
          ADDED: ${{ steps.scope.outputs.added }}
        run: |
          mapfile -t files < <(jq -r '.[]' <<<"$ADDED")
          status=0
          squawk --config .squawk.toml --reporter json "${files[@]}" > squawk.json || status=$?
          echo "squawk exit code: $status"
          if [ "$status" -ne 0 ] && [ ! -s squawk.json ]; then
            exit "$status"
          fi
          python -m tools.migrations.squawk_gate squawk.json
      - name: Classify destructive migrations
        id: classify
        if: steps.scope.outputs.added != '' && steps.scope.outputs.added != '[]'
        env:
          ADDED: ${{ steps.scope.outputs.added }}
        run: |
          mapfile -t files < <(jq -r '.[]' <<<"$ADDED")
          python -m tools.migrations.classify --squawk-json squawk.json "${files[@]}" > classification.json
          echo "destructive=$(jq -r .destructive classification.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Destructive classification"
            echo
            echo '```json'
            cat classification.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start local Supabase
        run: supabase db start
      - name: Replay migrations
        run: supabase db reset --local --no-seed
      - name: Schema-sync gate
        if: hashFiles('supabase/migrations/*_baseline.sql') != ''
        run: |
          python -m tools.migrations.fingerprint capture --dsn-env LOCAL_DB_URL --out fingerprint-migrations.json
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/supabase/migrations"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          supabase db reset --workdir "$workdir" --local --no-seed
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -q -f schema.sql
          python -m tools.migrations.fingerprint capture --dsn-env LOCAL_DB_URL --out fingerprint-schema-sql.json
          expected=()
          if [ -f supabase/schema-sync-expected-diff.json ]; then
            expected=(--expected supabase/schema-sync-expected-diff.json)
          fi
          python -m tools.migrations.fingerprint compare \
            fingerprint-migrations.json fingerprint-schema-sql.json \
            --ignore supabase/fingerprint-ignore.json "${expected[@]}" \
            --skip-sections storage_policies,storage_buckets
      - name: Schema-sync gate dormant
        if: hashFiles('supabase/migrations/*_baseline.sql') == ''
        run: >-
          echo "::notice::Schema-sync gate dormant: no baseline yet (activates in the cutover PR)"
      - name: Baseline equals prod snapshot
        if: hashFiles('supabase/migrations/*_baseline.sql') != ''
        run: |
          baseline="$(printf '%s\n' supabase/migrations/*_baseline*.sql | sort | tail -n 1)"
          version="$(basename "$baseline" | cut -d_ -f1)"
          supabase db reset --local --no-seed --version "$version"
          python -m tools.migrations.fingerprint capture --dsn-env LOCAL_DB_URL --out fingerprint-baseline.json
          python -m tools.migrations.fingerprint compare \
            fingerprint-baseline.json supabase/snapshots/prod-fingerprint-cutover.json \
            --ignore supabase/fingerprint-ignore.json
      - name: Upload migration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reports
          path: |
            squawk.json
            classification.json
            fingerprint-*.json
          if-no-files-found: ignore
          retention-days: 7

  pipeline-guard:
    name: Pipeline guard
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install migration tools
        run: python -m pip install -r requirements-ci.txt
      - name: Read PR scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          python -m tools.migrations.pr_scope --base "origin/$BASE_REF"
          || echo "Scope problems fail the Migrations job; this job only labels."
      - name: Classify added migrations
        id: classify
        if: steps.scope.outputs.added != '' && steps.scope.outputs.added != '[]'
        env:
          ADDED: ${{ steps.scope.outputs.added }}
        run: |
          mapfile -t files < <(jq -r '.[]' <<<"$ADDED")
          squawk --config .squawk.toml --reporter json "${files[@]}" > squawk.json || true
          python -m tools.migrations.classify --squawk-json squawk.json "${files[@]}" > classification.json
          echo "destructive=$(jq -r .destructive classification.json)" >> "$GITHUB_OUTPUT"
      # Labels are only ever added here, never removed.
      - name: Label pipeline change
        if: steps.scope.outputs.pipeline_change == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create pipeline-change --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Changes the deploy pipeline"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f "labels[]=pipeline-change" > /dev/null
      - name: Label destructive migration
        if: steps.classify.outputs.destructive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create destructive-migration --repo "$GITHUB_REPOSITORY" --force \
            --color D93F0B --description "Adds a migration that needs approval before it applies"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f "labels[]=destructive-migration" > /dev/null
