name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Permitted acceptance PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8.0" "ruff==0.15.20"
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard
      - name: Ruff lint
        run: ruff check .
      - name: Run permitted tests in an owned database
        run: >-
          python tools/lifecycle_test_db.py --postgres-major ${{ matrix.postgres }} --
          python tools/run_lifecycle_acceptance.py
      - name: Run permitted owned dashboard flows
        run: >-
          python tools/lifecycle_test_db.py --postgres-major ${{ matrix.postgres }} --
          python tools/run_lifecycle_acceptance.py dashboard

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  public-visual:
    name: Public visual
    runs-on: macos-14
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install visual regression browser
        run: npx playwright install chromium
      - name: Run public visual regression gate
        run: npm run test:visual:public
      - name: Upload public visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-visual-results
          path: |
            dashboard/test-results/visual/**
            !dashboard/test-results/visual/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
